name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Build and start Postgres (PostGIS + pgvector, amd64)
        working-directory: .
        run: |
          docker build -t qarau/postgres:ci infra/postgres
          docker run -d --name pg -p 5433:5432 \
            -e POSTGRES_USER=qarau -e POSTGRES_PASSWORD=qarau_dev -e POSTGRES_DB=qarau \
            --health-cmd "pg_isready -U qarau -d qarau" --health-interval 3s --health-retries 20 \
            qarau/postgres:ci
          timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" pg)" = healthy ]; do sleep 2; done'
      - run: uv run pytest
        env:
          QARAU_REQUIRE_DB: "1"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: test -d pipeline && echo present=true >> "$GITHUB_OUTPUT" || true
      - if: steps.dir.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: steps.dir.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Lint, typecheck and test pipeline
        if: steps.dir.outputs.present == 'true'
        working-directory: pipeline
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: test -d web && echo present=true >> "$GITHUB_OUTPUT" || true
      - if: steps.dir.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - if: steps.dir.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install, lint, typecheck, test and build web
        if: steps.dir.outputs.present == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
