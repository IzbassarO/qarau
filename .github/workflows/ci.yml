name: ci

on:
  push:
    branches: [main, dev]  # task branches get CI through their PR (one run, not two)
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: test -d pipeline && echo present=true >> "$GITHUB_OUTPUT" || true
      - if: steps.dir.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: steps.dir.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Lint, typecheck and test pipeline
        if: steps.dir.outputs.present == 'true'
        working-directory: pipeline
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy .
          uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: test -d web && echo present=true >> "$GITHUB_OUTPUT" || true
      - if: steps.dir.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - if: steps.dir.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install, lint, typecheck, test and build web
        if: steps.dir.outputs.present == 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

  devteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dir
        run: test -d devteam && echo present=true >> "$GITHUB_OUTPUT" || true
      - if: steps.dir.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5
      - name: Install gitleaks (MIT)
        if: steps.dir.outputs.present == 'true'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Lint and test devteam
        if: steps.dir.outputs.present == 'true'
        working-directory: devteam
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, MIT)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git --no-banner --redact .
