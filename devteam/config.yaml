# Qarau dev team. All models live here; keys live only in devteam/.env.

# No human review. Each task: branch devteam/<task> from dev, PR into dev, auto-merged only
# when every gate is green. dev -> main: weekly release PR, merged only if CI and the full
# benchmark are green on dev.
base_branch: dev
# Viewer runs (relative to the main checkout): the one place the pipeline writes runs to, the web
# viewer and backend read them from, and the tester screenshots. Every step gets it as
# QARAU_RUNS_DIR ({runs_dir} in commands). P3e wrote data/runs while the tester's viewer read the
# quick benchmark output: "manifest.json not found" (2026-10-18).
runs_dir: data/runs
release_branch: main
release_every_days: 7
max_fix_loops: 3          # times a task (each part of it, when the brain planned parts) is sent
                          # back (tester or gates), then "blocked"

gates:
  ci_timeout_min: 40
  # shoot.mjs waits, after the fixed wait, until the page is ready (no aria-busy="true" or
  # [data-loading], network idle); still busy then: shot anyway, labelled NOT-READY.
  screenshot_ready_timeout_s: 30
  # No agent may change these; devteam/, .github/, backlog.yaml, CLAUDE.md and AGENTS.md are
  # always protected (devteam/scope.py). A change is a hard fail, the task is blocked.
  protected:
    - pipeline/qarau_pipeline/benchmark_set.toml   # the videos the benchmark gate measures
    - web/eslint.config.*
    - .gitleaks*
    - .pre-commit-config.yaml
    - docs/design/*   # design system v8, the UI's source of truth (owner, 2026-10-24): owner only
  # Owner-approved test rewrites, per task. Owner decision 2026-10-24: design system v8 is the
  # source of truth, so DS1 moves tests that pin the old look (finding-inspected blue, #000 canvas,
  # violet accent, IBM Plex Mono, 3:1 border/focus contrast, no sign-in gradient) to the v8 values.
  # In these files the anti-bypass check ignores removed assertions and moved thresholds for that
  # task only; skipping or focusing a test is still refused, and the tester is told it is approved.
  test_rewrite_allowed:
    DS1:
      - web/src/design/tokens.test.ts
      - web/src/design/noLiterals.test.ts
      - web/src/viewer/engine.test.ts
      - web/e2e/far-layer.spec.ts
      # owner, 2026-10-26: the v1 centred-card assertions become v8 split-layout ones
      - web/e2e/login.spec.ts
  benchmark:
    when_paths: [pipeline/]   # run only when the change touches these
    # Contract (task P1): writes {out}/results.json, reads videos from {data} (read-only);
    # {data} = data/samples of the main checkout.
    command: cd pipeline && uv run python -m qarau_pipeline benchmark --data {data} --out {out}
    timeout_min: 90
    max_drop_registered_pct: 2.0   # percentage points
    max_rise_reproj_pct: 10
    max_drop_points_pct: 10
    max_rise_scale_err_cm: 0.5
    # Measured run-to-run noise (docs/notes/benchmark-method.md, Variance). Mykolaiv on the
    # same 300 frames: 178/210 -> 81/210 registered, 3 -> 5 models, 10 k -> 3 k points. No
    # threshold separates that from a real change: shown in the packet, not gated. P3c
    # (2026-10-16, "Mykolaiv (P3c)" there) found why: an edited night news clip (~18 shots,
    # title cards, burned-in logo), no one honest model. Owner, 2026-10-21: stays ungated.
    per_video:
      mykolaiv: {gated: false, why: "edited news clip, no one honest model (P3c); owner 2026-10-21: not gated"}
    # Developer rounds run only these (~11 min, low run-to-run noise); the full set runs only at the
    # merge gate and at release. Saves subscription limits and round time.
    quick_only: [notre-dame, room]
    # A task may set its own `quick_only` in the backlog (e.g. videos its screenshots need).
    quick_min: 11
  # Playwright e2e, run by Kerege right after a round on a clean checkout, for tasks that change
  # web/: a fresh Vite on a free port ({port} -> QARAU_E2E_PORT; web/playwright.config.ts never
  # reuses a server), stopped after with everything the step started. A failure goes back to the
  # developer without an LLM tester call. A Codex sandbox cannot open a port (listen EPERM), so
  # developers never run e2e themselves (A5-fix, 2026-10-18).
  e2e:
    when_paths: [web/]
    # Fixed --workers=3 --retries=1 (owner, 2026-10-27): with the default workers the phone WebGL
    # tests timed out at 180 s on a loaded Mac and one flake blocked a round (24/24 re-runs passed).
    # A test that fails, then passes on the retry, is FLAKY: not blocking, but listed in the packet,
    # the PR and the daily report. A test that fails twice blocks as before. A task may set its own
    # `e2e: {retries: 0}` in the backlog (UI-report-s2, 2026-10-30: "passes with --retries=0").
    retries: 1
    command: cd web && pnpm install --frozen-lockfile --prefer-offline >/dev/null && QARAU_E2E_PORT={port} QARAU_RUNS_DIR={runs_dir} pnpm exec playwright test --reporter=list --workers=3 --retries={retries}
    # Measured 2026-10-26 on DS1 HEAD (208 tests, desktop + phone projects, 5 workers): 8.7 min
    # alone, 9.0 min in Kerege, so ~15 min at 3 workers, plus retries. 30 keeps a margin; a run
    # past it is reported to the developer as TIMEOUT with the counts, never as a test failure.
    timeout_min: 30
  # Run on the backlog every status commit would push to dev, before it is pushed: a failure
  # keeps the status local and warns (778e072 `backlog: A9-fix done (#41)` turned dev CI red).
  # {devteam}: devteam/ of that same fetched dev (its tests and code), not the main checkout's,
  # which may be older (2026-10-29 14:33: a false failure). Without {devteam}: the checkout's tests.
  backlog_check: PYTHONPATH={devteam} uv run --quiet pytest -q -m backlog -p no:cacheprovider {devteam}/tests
daily_budget_usd: 15.0   # Anthropic API (brain, tester), over any 24 h

# Providers (Kerege v3 K1, owner 2026-10-28). A role (models.*) or a developer names its
# provider; the developer's CLI follows from it. anthropic: API, pay per use (daily_budget_usd).
# claude_code / codex_cli: the subscriptions, not billed per call. kimi_cli: Kimi Code CLI on the
# Kimi Open Platform key (pay per use, its own caps, devteam/kimi.py). openai_compatible: named
# for the API roles, not built yet. Off (or no key, a cap reached, Kimi failing): the developer's
# `fallback` takes the round, logged in one line; kimi_cli off = Kerege v2.
providers:
  kimi_cli:
    enabled: true
    key: MOONSHOT_API_KEY             # devteam/.env; Open Platform key, not a Kimi Code plan
    upstream: https://api.moonshot.ai # the CLI talks only to Kerege's proxy, which adds the key
    daily_usd: 5.0                    # any 24 h (owner 2026-10-28)
    monthly_usd: 50.0                 # calendar month; at a cap dev_app falls back to Codex
    price_in: 2.0                     # $ per 1M tokens, kimi-k3.1-pro (Open Platform, 2026-10)
    price_out: 10.0
    price_cache_read: 0.2

# `devteam run --continuous` (Kerege): per developer, plan the next task when one ends.
# A developer with 2 tasks in a row blocked pauses; the run stops when no developer can take a
# task, at the daily budget, these limits, Ctrl+C.
continuous:
  max_hours: 10              # then a clean stop (current steps finish, the next run resumes)
  max_tasks: 8               # tasks taken per run; then no new ones, running ones finish
  limit_wait_max_hours: 5    # subscription limit: wait for the reset, at most this long

# Supervisor (owner, 2026-10-17): per task, so one task going wrong never burns the plan or
# stops the others (A7 used 42.6 M tokens while blocked, P2b 17 M). Tokens = subscription tokens
# of the developer (in + cached + out, as the dashboard shows them), counted live. Over a limit:
# that step is killed, the task is blocked with the reason, the other developers keep going.
# Raised 2026-10-23 (owner): since backlog #66 the tasks are 2-3x larger by design (fewer, bigger
# tasks; the brain plans parts inside a task). Run cont-20261023-094355 blocked S1 at 8.2 M and
# DEF1-api at 8.4 M per round (limit was 8 M) and U2 at 17 M per task (limit was 12 M) while U2
# was otherwise green (653 tests, 16 screenshots).
supervisor:
  max_tokens_per_round: 16000000  # one developer round
  max_tokens_per_task: 36000000   # all rounds of the task in this run (resume starts again)
  max_round_min: 90               # longest round; a task may set its own (backlog `supervisor:`)
  max_idle_min: 20                # no output from the developer and no CPU work in its processes

# Roles (Kerege v3, owner 2026-10-28): who does what. One executor (a key of `models` or
# `developers`) may serve several roles for now.
roles:
  cto: brain                    # plans: picks tasks, writes plans and criteria
  architect: architect          # context brief before a task is planned; missing prerequisites
  analyst: analyst              # diagnoses blocked tasks, small plan changes, plan proposals
  core_developer: dev_pipeline  # pipeline/
  backend_developer: dev_pipeline  # backend/
  design_developer: dev_app     # web/
  devops_release: dev_pipeline  # infra/; the release itself is Kerege's
  qa: tester
  code_reviewer: tester
  risk_analyst: tester          # red team
  design_qa: tester
  artifact_curator: brain

# provider: anthropic for now. Prices are $ per 1M tokens, used for the cost report.
# architect / analyst: `enabled: false` = Kerege v2 (no brief; a blocked task waits for the owner).
models:
  brain:
    provider: anthropic
    model: claude-opus-5-5
    effort: high
    price_in: 4.0
    price_out: 20.0
    price_cache_read: 0.2   # prompt cache hits; 1 h cache writes cost 2x price_in
  tester:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    price_in: 2.0
    price_out: 10.0
    price_cache_read: 0.2
  architect:                # read-only, before the brain plans a task (devteam/architect.py)
    enabled: true
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    price_in: 2.0
    price_out: 10.0
    price_cache_read: 0.2
  analyst:                  # every blocked task; at most 3 plan changes a day (devteam/analyst.py)
    enabled: true
    provider: anthropic
    model: claude-sonnet-5-5
    effort: high
    price_in: 2.0
    price_out: 10.0
    price_cache_read: 0.2

developers:
  dev_pipeline:
    provider: claude_code  # Claude Code headless, your subscription (CLAUDE_CODE_OAUTH_TOKEN)
    model: claude-opus-5-5 # owner 2026-10-24: the subscription's Fable weekly limit is used up
    areas: [core]          # backlog tasks with this area may go to this developer
    owns: [pipeline/, backend/, infra/, docs/]   # enforced on the diff (scope gate)
    timeout_min: 90
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - "Bash(uv run:*)"
      - "Bash(uv sync:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(ls:*)"
    disallowed_tools:      # agents never push, merge or touch GitHub; the orchestrator does
      - "Bash(git push:*)"
      - "Bash(git rebase:*)"
      - "Bash(git reset:*)"
      - "Bash(git branch:*)"
      - "Bash(gh:*)"
    setup: []
    screenshots:           # viewer on the quick benchmark output ({runs}); routes /viewer/<video>.
                           # A task that writes runs_dir (writable) is shown runs_dir instead.
      serve: cd web && pnpm install --frozen-lockfile --prefer-offline >/dev/null && QARAU_RUNS_DIR={runs} pnpm exec vite --port 5197 --strictPort
      url: http://localhost:5197
      shoot: cd web && node {shoot} {url} {png} {size} 4000   # signs in first (devteam/.env test user)
      # viewports: [1440x900, 390x844]   # the default; {size} is each one, as 1440,900
    checks:                # same as GitHub CI, so CI rarely surprises
      - cd pipeline && uv run ruff check . && uv run ruff format --check . && uv run mypy .
      - cd pipeline && uv run pytest -q
      - cd backend && uv run ruff check . && uv run ruff format --check . && uv run mypy .
      - cd backend && uv run pytest -q
  dev_app:
    provider: kimi_cli     # Kimi Code CLI on MOONSHOT_API_KEY (owner 2026-10-28)
    model: kimi-k3.1-pro   # Open Platform id (k3.1-pro is the Kimi Code plan's: another key)
    fallback:              # Codex CLI, your saved ChatGPT login
      provider: codex_cli
    areas: [app]
    owns: [web/, docs/decisions/*.md, docs/notes/*.md]   # web/ + markdown plans and ADRs
    timeout_min: 60
    setup:                 # runs before every round: the Codex sandbox has no network
      - cd web && pnpm install --frozen-lockfile
    screenshots:           # pages from the plan's `routes`; the tester sees them
      # The real API (backend/ of the same checkout) on a fresh SQLite file ({db}), migrated and
      # seeded (backend/app/seed.py: org "dev", users admin / engineer / viewer, and "Demo site": one
      # inspection on run notre-dame-p3e with one manual finding, 3 evidence frames) for every
      # screenshot session, on a free port ({api_port}); Vite proxies /api to it (QARAU_API_PROXY).
      # Open dev mode (empty QARAU_API_TOKEN). Without a backend the pages showed "could not load
      # sites" / "Status unavailable" (U2, 2026-10-23).
      api: >-
        cd backend && export QARAU_DATABASE_URL=sqlite:///{db} QARAU_RUNS_DIR={runs_dir}
        QARAU_ENV=dev QARAU_DEV_ADMIN_TOKEN=dev-admin QARAU_DEV_ENGINEER_TOKEN=dev-engineer
        QARAU_DEV_VIEWER_TOKEN=dev-viewer QARAU_API_TOKEN=""
        && uv run --quiet alembic upgrade head && uv run --quiet python -m app.seed
        && exec uv run --quiet uvicorn app.main:app --host 127.0.0.1 --port {api_port}
      # The tester signs in as the seeded engineer (the password is the Bearer token: the api's
      # QARAU_DEV_ENGINEER_TOKEN, a public dev seed value, not a secret), so role-dependent UI is shot
      # as an engineer sees it. The .env test user matched no seeded user: /api/me 401, role error,
      # no decision buttons (UI-evidence-b, 2026-10-28). Without `api` the .env test user is used.
      login: {user: engineer, token: dev-engineer}
      # A plan route {path, session: guest} is shot as an event guest (DEMO1-ui, 2026-10-29: shot
      # as the engineer, a guest's viewer was never seen): an event on the same {db} through the
      # real app.event create, sharing the seeded run, expiring in 1 h ({expires}); its code signs
      # in through the sign-in page and the event is purged after, also on failure. Remove this
      # block: every route is shot as the engineer again.
      guest:
        run: notre-dame-p3e   # backend/app/seed.py DEMO_RUN: the only done run in the test database
        create: >-
          cd backend && QARAU_DATABASE_URL=sqlite:///{db} uv run --quiet python -m app.event create
          --name {name} --org {name} --expires {expires} --max-guests 100 --runs {run}
        purge: cd backend && QARAU_DATABASE_URL=sqlite:///{db} uv run --quiet python -m app.event purge --name {name}
      serve: cd web && QARAU_RUNS_DIR={runs_dir} QARAU_API_PROXY=http://127.0.0.1:{api_port} pnpm exec vite --port 5198 --strictPort
      url: http://localhost:5198
      shoot: cd web && node {shoot} {url} {png} {size} 2500 {theme} {lang}
      themes: [light, dark]  # {theme}: prefers-color-scheme, each viewport in both
      # {lang}: the app locale. Every viewport x theme in the first; the others at every viewport
      # in the first theme (kk dates broke in Chrome unseen: shots were ru only, 2026-10-21)
      locales: [ru, kk, en]
    checks:
      - cd web && pnpm lint && pnpm typecheck
      - cd web && pnpm test && pnpm build
