# Qarau dev team. All models live here; keys live only in devteam/.env.

# Task branches start from this branch, and `devteam review` merges approved work into it.
# Never main: you open the PR dev -> main yourself.
base_branch: dev
max_fix_loops: 3
daily_budget_usd: 3.0     # API spend cap (brain + tester); subscriptions are not counted

# provider: anthropic for now. Prices are $ per 1M tokens, used for the cost report.
models:
  brain:
    provider: anthropic
    model: claude-opus-5-5
    effort: high
    price_in: 4.0
    price_out: 20.0
  tester:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    price_in: 2.0
    price_out: 10.0

developers:
  dev_pipeline:
    tool: claude           # Claude Code headless, your subscription (CLAUDE_CODE_OAUTH_TOKEN)
    owns: [pipeline/, backend/, infra/]
    timeout_min: 60
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - "Bash(uv run:*)"
      - "Bash(uv sync:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(ls:*)"
    setup: []
    checks:
      - cd pipeline && uv run ruff check . && uv run ruff format --check .
      - cd pipeline && uv run pytest -q
      - cd backend && uv run pytest -q
  dev_app:
    tool: codex            # Codex CLI, your saved ChatGPT login
    owns: [web/]
    timeout_min: 60
    setup:
      - cd web && pnpm install --frozen-lockfile
    checks:
      - cd web && pnpm lint && pnpm typecheck
      - cd web && pnpm test
