# Qarau dev team. All models live here; keys live only in devteam/.env.

# No human review. Each task: branch devteam/<task> from dev, PR into dev, auto-merged only
# when every gate is green. dev -> main: weekly release PR, merged only if CI and the full
# benchmark are green on dev.
base_branch: dev
release_branch: main
release_every_days: 7
max_fix_loops: 3          # times a task is sent back (tester or gates), then "blocked"

gates:
  ci_timeout_min: 40
  benchmark:
    when_paths: [pipeline/]   # run only when the change touches these
    # Contract (task P1): writes {out}/results.json, reads videos from {data} (read-only);
    # {data} = data/samples of the main checkout.
    command: cd pipeline && uv run python -m qarau_pipeline benchmark --data {data} --out {out}
    timeout_min: 90
    max_drop_registered_pct: 2.0   # percentage points
    max_rise_reproj_pct: 10
    max_drop_points_pct: 10
    max_rise_scale_err_cm: 0.5
    # Measured run-to-run noise (docs/notes/benchmark-method.md, Variance). Mykolaiv on the
    # same 300 frames: 178/210 -> 81/210 registered, 3 -> 5 models, 10 k -> 3 k points. No
    # threshold separates that from a real change: shown in the packet, not gated, until P3.
    per_video:
      mykolaiv: {gated: false, why: "COLMAP noise 39-85 % registered on identical frames; gate again after P3"}
    # Developer rounds run only these (~11 min, low run-to-run noise); the full set runs only at the
    # merge gate and at release. Saves subscription limits and round time.
    quick_only: [notre-dame, room]
    # A task may set its own `quick_only` in the backlog (e.g. videos its screenshots need).
    quick_min: 11
daily_budget_usd: 3.0     # API spend cap (brain + tester); subscriptions are not counted

# `devteam run --continuous` (Kerege): per developer, plan the next task when one ends.
# Stops at: no plannable task, daily budget, 2 tasks in a row blocked, these limits, Ctrl+C.
continuous:
  max_hours: 10              # then a clean stop (current steps finish, the next run resumes)
  max_tasks: 8               # tasks taken per run; then no new ones, running ones finish
  limit_wait_max_hours: 5    # subscription limit: wait for the reset, at most this long

# Supervisor (owner, 2026-10-17): per task, so one task going wrong never burns the plan or
# stops the others (A7 used 42.6 M tokens while blocked, P2b 17 M). Tokens = subscription tokens
# of the developer (in + cached + out, as the dashboard shows them), counted live. Over a limit:
# that step is killed, the task is blocked with the reason, the other developers keep going.
supervisor:
  max_tokens_per_round: 8000000   # one developer round
  max_tokens_per_task: 12000000   # all rounds of the task in this run (resume starts again)
  max_round_min: 60               # a round commits only when it ends: the longest without a commit

# provider: anthropic for now. Prices are $ per 1M tokens, used for the cost report.
models:
  brain:
    provider: anthropic
    model: claude-opus-5-5
    effort: high
    price_in: 4.0
    price_out: 20.0
    price_cache_read: 0.2   # prompt cache hits; 1 h cache writes cost 2x price_in
  tester:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    price_in: 2.0
    price_out: 10.0
    price_cache_read: 0.2

developers:
  dev_pipeline:
    tool: claude           # Claude Code headless, your subscription (CLAUDE_CODE_OAUTH_TOKEN)
    areas: [core]          # backlog tasks with this area may go to this developer
    owns: [pipeline/, backend/, infra/]
    timeout_min: 90
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - "Bash(uv run:*)"
      - "Bash(uv sync:*)"
      - "Bash(git status:*)"
      - "Bash(git diff:*)"
      - "Bash(git log:*)"
      - "Bash(ls:*)"
    disallowed_tools:      # agents never push, merge or touch GitHub; the orchestrator does
      - "Bash(git push:*)"
      - "Bash(git rebase:*)"
      - "Bash(git reset:*)"
      - "Bash(git branch:*)"
      - "Bash(gh:*)"
    setup: []
    screenshots:           # viewer on the developer's quick benchmark output ({runs}); routes /viewer/<video>
      serve: cd web && pnpm install --frozen-lockfile --prefer-offline >/dev/null && QARAU_RUNS_DIR={runs} pnpm exec vite --port 5197 --strictPort
      url: http://localhost:5197
      shoot: cd web && pnpm exec playwright screenshot --viewport-size=1440,900 --wait-for-timeout=4000 {url} {png}
    checks:                # same as GitHub CI, so CI rarely surprises
      - cd pipeline && uv run ruff check . && uv run ruff format --check . && uv run mypy .
      - cd pipeline && uv run pytest -q
      - cd backend && uv run ruff check . && uv run ruff format --check . && uv run mypy .
      - cd backend && uv run pytest -q
  dev_app:
    tool: codex            # Codex CLI, your saved ChatGPT login
    areas: [app]
    owns: [web/]
    timeout_min: 60
    setup:                 # runs before every round: the Codex sandbox has no network
      - cd web && pnpm install --frozen-lockfile
    screenshots:           # pages from the plan's `routes`; the tester sees them
      serve: cd web && QARAU_RUNS_DIR={data}/runs pnpm exec vite --port 5198 --strictPort
      url: http://localhost:5198
      shoot: cd web && pnpm exec playwright screenshot --viewport-size=1440,900 --wait-for-timeout=2500 {url} {png}
    checks:
      - cd web && pnpm lint && pnpm typecheck
      - cd web && pnpm test && pnpm build
