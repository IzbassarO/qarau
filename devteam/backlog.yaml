    every result, and failed runs with their reasons.

    '
  licence: 'SQLAlchemy and Alembic (MIT), boto3 (Apache-2.0), Versity S3 Gateway (Apache-2.0), pgvector
    (PostgreSQL licence). PostGIS (GPL-2.0): only as a separate, unmodified database server reached over
    SQL (ADR 0010, owner 2026-10-15).

    '
  status: todo
- id: S1
  area: core
  phase: server
  title: Server job queue with per-stage progress
  goal: 'The pipeline runs as jobs from a durable queue: Valkey + RQ (ADR 0012; not Redis). The queue
    runs the current sparse pipeline now; the dense stage (P4a-2) is plugged in later as one more stage.
    Each stage reports progress 0-100 to the API (backend/), which U2 shows in the web app. A 30-minute
    video is processed on a single worker without blocking the API.


    Acceptance:

    - Upload -> job -> progress available from the API -> the run is in the catalog when done.

    - One stage can be re-run alone (stages are idempotent and read/write storage).

    - The API stays responsive while a long job runs (test with a long job).

    - Valkey runs in infra/ Docker Compose; no Redis image or Redis-only feature is used.

    '
  licence: 'Valkey (BSD-3-Clause), RQ (BSD-2-Clause), redis-py client (MIT). Redis server is not used:
    RSALv2/SSPLv1 since 7.4, AGPLv3 since 8.0 (owner 2026-10-15, ADR 0012).

    '
  status: todo
