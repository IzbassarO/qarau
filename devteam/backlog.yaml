  title: Metric scale from a reference sheet (Letter, A4 or custom)
  goal: 'A paper sheet of known size as the scale reference: the user marks its four corners in order
    in two or more frames; the scale is fitted to the four edges and two diagonals (both orientations),
    and the fit residual is reported as the scale error. The sheet size is a parameter of the scale reference
    (docs/notes/scale-reference-format.md): letter = 215.9 x 279.4 mm (the default: the owner is in the
    US), a4 = 210 x 297 mm, or custom = width x height in mm. Reuses the reference format, triangulation
    and alignment of P5a-1; a first draft of the A4 fit (hard-coded 210 x 297 mm) is in commit b26082f
    on branch devteam/P5a. Automatic detection of the sheet in images is not in this task.


    Acceptance:

    - Without a size the sheet is letter; a4 and custom width x height in mm are accepted; an unknown
    size name or a non-positive custom size is a clear error.

    - The run report (and the export metadata) shows which sheet size was used: its name and its dimensions
    in mm (e.g. "letter 215.9 x 279.4 mm").

    - Tests: synthetic scenes with a letter sheet and with an a4 sheet each recover the known scale; the
    custom size is parsed and validated.

    - docs/notes/scale-reference-format.md documents the size parameter and its default.

    - ruff, mypy and pytest pass.

