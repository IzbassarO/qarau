- id: P3b
  area: core
  title: Sky mask and far-point filter
  goal: 'Owner''s review 2026-10-15: long outdoor shots grow a "sky wall" of far, badly triangulated points
    that hides buildings and trees in the default view. Split out of P3 (merged in #18).


    1. Sky mask before feature extraction: mask sky regions per frame and pass the masks to COLMAP feature
    extraction (ImageReaderOptions.mask_path), so no feature inside the sky is extracted or matched. A
    classical detector on OpenCV (Apache-2.0, already a dependency) or a small Apache-2.0/MIT segmentation
    model; NVIDIA SegFormer is not allowed. Record the choice and its licence in ADR docs/decisions/0013-*.
    Tests on synthetic frames with a known sky region.


    2. Point filter after mapping: drop 3D points with triangulation angle < 1.5 degrees or reprojection
    error above COLMAP''s robust threshold (mapper filter_max_reproj_error, 4 px by default). The run
    report and the benchmark results.json show points_total, points_dropped_low_parallax, points_dropped_reproj.


    3. Far layer: far points that survive the filter are exported as a separate `far` layer in the viewer
    bundle (own arrays + manifest key, ADR 0003), never mixed into the object cloud. Rendering it is A5
    (dev_app); until then the viewer does not load it.


    Re-test (owner 2026-10-16): the pipeline work is done on branch devteam/P3b (sky mask, triangulation-angle
    / reprojection filter, far layer, counters, ADR 0013). Continue on that branch with dev merged in
    (A4/A4b viewer fix; devteam merges, never rebases), rerun the checks and the quick benchmark. No new
    pipeline changes unless the tester finds a real pipeline defect.


    Acceptance:


    - The tester MUST take its own screenshots of /viewer/notre-dame and /viewer/aegviidu; a pass without
    them is a fail. In the default view (after A4b), compared with dev from the same camera: no wall or
    band of points in the sky; far points appear only in the separate far layer. (The orchestrator adds
    dev-*.png screenshots of the same routes on dev''s gate benchmark.) Sparse clouds are never expected
    to look like the object: do not judge recognisability before dense reconstruction (P4).


    - Registered-frames ratio is not below dev on any gated video.

    - points_total, points_dropped_low_parallax, points_dropped_reproj are in the run report and results.json.

    - Tests for the sky mask, the point filter counts and the far layer export.

    '
  owner: dev_pipeline
  quick_only:
  - notre-dame
  - aegviidu
  licence: 'Classical sky detector on OpenCV (Apache-2.0) preferred. Any model must be Apache-2.0/MIT/BSD
    for code AND weights; note it in ADR 0013. NVIDIA SegFormer weights are under the NVIDIA Source Code
    License (non-commercial): forbidden. Unclear -> ask the owner.

    '
  status: done
