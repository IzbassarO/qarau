tasks:
- id: P1
  area: core
  title: Benchmark command over all reference videos
  goal: 'One command (e.g. `python -m qarau_pipeline benchmark`) runs every reference video in data/samples/
    (the 4 public videos now, the owner''s room video when it is added) and writes a table: registered
    frames %, number of models, mean reprojection error, points, scale error (blank until P5), time. Results
    are saved per commit (commit hash in the file name / row) and appended to docs/notes/benchmark.md.
    Contract used by the merge gate (devteam/config.yaml gates.benchmark): `python -m qarau_pipeline benchmark
    --data <dir> --out <dir>` reads videos from --data (read-only), writes everything under --out, and
    writes --out/results.json = {"videos": {name: {registered_pct, models, reproj_px, points, scale_err_cm
    (null until P5/P7), time_s}}}. Exit code 0 only if every video ran.

    '
  status: done
  owner: dev_pipeline
  run: run-20261014-213422
  branch: devteam/P1
  pr: https://github.com/IzbassarO/qarau/pull/3
  done_at: '2026-10-15'
- id: P2a
  area: core
  title: Robust phone import
  goal: 'The frames stage handles HEVC, HDR -> SDR, rotation metadata and variable frame rate for any
    phone video, with tests on synthetic clips for each case.

    '
  status: done
  owner: dev_pipeline
  run: run-20261015-081950
  branch: devteam/P2a
  pr: https://github.com/IzbassarO/qarau/pull/9
  done_at: '2026-10-15'
- id: P0
  area: core
  title: Export never crashes on far outlier points
  goal: 'The export stage crashed on mykolaiv in a gate run (laspy OverflowError: "Values given do not
    fit after applying offset and scale") after a good reconstruction (178/210 frames), so the whole benchmark
    failed. Choose LAS offset/scale from the actual point extent (or drop non-finite / absurdly far points
    and report how many), with a test on synthetic points far from the origin. Log: devteam/.state/bench/beadd07*/mykolaiv/log.txt
    on the dev Mac.

    '
  status: todo
- id: P3
  area: core
  title: One connected model per video, without a sky wall
  goal: 'Use loop detection, the global mapper and model merging so one video gives one model. Measure
    with the P1 benchmark: number of models and registered % before and after. Priority: 3 of 5 benchmark
    videos split into several models (aegviidu 3, mykolaiv 3, room 2 on a8efcc9).


    Owner''s review 2026-10-15: long outdoor shots grow a "sky wall" of far, badly triangulated points
    that hides buildings and trees in the default view. Also in this task:


    1. Sky masks before feature extraction: mask sky regions per frame and pass the masks to COLMAP feature
    extraction (ImageReaderOptions.mask_path), so no feature inside the sky is extracted or matched. Prefer
    a light, permissive approach: a classical detector on OpenCV (Apache-2.0, already a dependency), or
    a small Apache/MIT segmentation model. Record the choice and its licence in a new ADR (docs/decisions/0011-*).
    Tests on synthetic frames with a known sky region.


    2. Point filtering after mapping: drop (or flag separately) 3D points with triangulation angle < 1.5
    degrees or reprojection error above COLMAP''s robust threshold (mapper filter_max_reproj_error, 4
    px by default). The run report and the benchmark results.json show points_total, points_dropped_low_parallax,
    points_dropped_reproj.


    3. Far layer: far points that survive filtering are exported as a separate `far` layer in the viewer
    bundle (own arrays + manifest key, ADR 0003), never mixed into the object cloud. Rendering it (gray,
    toggle) is task A5 (dev_app); until then the viewer simply does not load it.


    Acceptance (in addition to the criteria above):

    - On the owner''s room video and on notre-dame there is no sky wall occluding buildings or trees in
    the default view (the tester judges this from its own screenshots).

    - Benchmark registered-frames % does not drop vs the dev baseline on any gated video.

    - Tests for the sky mask, the point filter counts and the far layer export.

    '
  status: todo
  licence: 'Classical sky detector on OpenCV (Apache-2.0) preferred. Any model must be Apache-2.0/MIT/BSD
    for code AND weights; note it in the ADR. NVIDIA SegFormer weights are under the NVIDIA Source Code
    License (non-commercial): forbidden. Unclear -> ask the owner.

    '
- id: P2b
  area: core
  title: Parallax keyframes and a footage quality report
  goal: 'Keyframes are chosen by parallax (enough camera motion), not a fixed rate. A quality report lists
    problems with plain re-shoot advice: blur, moving too fast, pure rotation (turning on the spot), low
    texture.

    '
  status: todo
- id: P4a
  area: core
  title: Dense reconstruction stage (commercial licence)
  goal: 'A dense stage behind the Densifier interface, starting from branch wip/dense-stage (ADR 0008).
    Model: Depth Anything V2 **Small only** (depth-anything/Depth-Anything-V2-Small-hf, Apache-2.0); Base
    and Large are CC-BY-NC (non-commercial) and must never be loaded: the code refuses any other model
    id, with a test. Exported to the viewer bundle.

    '
  status: todo
  licence: 'Depth Anything V2 Small code and weights: Apache-2.0 (owner confirmed 2026-10-15). Base/Large:
    CC-BY-NC-4.0, forbidden.

    '
- id: P4b
  area: core
  title: Frame-to-point links for dense points
  goal: 'Every dense point keeps the list of frames that saw it, stored in the bundle, so the evidence
    panel can show source frames for any point.

    '
  status: todo
- id: S1
  area: core
  phase: server
  title: Server job queue with per-stage progress
  goal: 'The pipeline runs as jobs from a durable queue: Valkey + RQ (ADR 0012; not Redis). Each stage
    reports progress 0-100 to the API; the viewer shows the current stage and percent. A 30-minute video
    is processed on a single worker without blocking the API.


    Acceptance:

    - Upload -> job -> progress visible -> the map opens when the job is done.

    - One stage can be re-run alone (stages are idempotent and read/write storage).

    - The API stays responsive while a long job runs (test with a long job).

    - Valkey runs in infra/ Docker Compose; no Redis image or Redis-only feature is used.


    Note: the web part (stage + percent in the UI) is in web/, owned by dev_app. When S1 unblocks, it
    becomes its own dev_app task; S1 itself delivers the progress API.

    '
  licence: 'Valkey (BSD-3-Clause), RQ (BSD-2-Clause), redis-py client (MIT). Redis server is not used:
    RSALv2/SSPLv1 since 7.4, AGPLv3 since 8.0 (owner 2026-10-15, ADR 0012).

    '
  status: blocked
  blocked_by:
  - P4a
  blocked_reason: 'Waits for P4a (dense stage): the queue runs the full pipeline, including the dense
    stage.'
- id: P5a
  area: core
  title: Metric scale and gravity from an A4 sheet or a measured distance
  goal: 'The user marks an A4 sheet or one known distance; the map is scaled to metres and rotated so
    gravity points down. Scale error is reported in the benchmark.

    '
  status: todo
- id: P5b
  area: core
  title: Drone telemetry reader (GPS, DJI SRT)
  goal: 'Read per-frame GPS / DJI SRT telemetry into the capture so scale and georeference can come from
    it later. Tested on a sample SRT file.

    '
  status: todo
- id: P6
  area: core
  title: Point confidence and honest display
  goal: 'Every point gets a confidence score from number of views, triangulation angle, reprojection error
    and multi-view consistency, stored in the bundle. Low-confidence points are hidden or shown grey as
    "uncertain". Holes are shown as "not reconstructed", never filled for looks. Estimated (prior-based)
    geometry is marked and excluded from measurements.

    '
  licence: 'Own code on NumPy (BSD-3-Clause), pycolmap/COLMAP (BSD-3-Clause; check the licences of libraries
    bundled in the pycolmap wheel), Open3D if needed (MIT).

    '
  status: todo
- id: P7
  area: core
  title: Accuracy check with AprilTag markers
  goal: 'Detect printed AprilTags (tag36h11) in the video, use their known printed size for metric scale,
    and report the scale error in cm in the P1 benchmark. Include a printable tag sheet and filming instructions
    in docs.

    '
  licence: 'OpenCV ArUco module with the AprilTag dictionaries (Apache-2.0, already a pipeline dependency)
    - no new library. Alternative: AprilRobotics/apriltag (BSD-2-Clause).

    '
  status: todo
- id: D1
  area: core
  title: Data foundation - storage layout and run catalog
  goal: 'S3 layout: raw/ (immutable, never overwritten) and processed/<pipeline_version>/. Catalog tables
    via Alembic (assets, captures, runs, stage_runs) record pipeline, model and parameter versions for
    every result, and failed runs with their reasons.

    '
  licence: 'SQLAlchemy and Alembic (MIT), boto3 (Apache-2.0), Versity S3 Gateway (Apache-2.0), pgvector
    (PostgreSQL licence). PostGIS (GPL-2.0): only as a separate, unmodified database server reached over
    SQL (ADR 0010, owner 2026-10-15).

    '
  status: todo
