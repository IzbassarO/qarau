  title: 'Readable default view: real RGB by default, frustums hidden by default'
  goal: 'Follow-up to A4 (#22, built to the old criteria), owner 2026-10-16. A4 delivered robust 2-98
    % framing (+Z up, no roll), frustum size scaled to the scene and an RGB / height-blue toggle, but
    the default view is unchanged: the colour mode defaults to height-blue, the build-up ("first seen
    / not yet seen") colouring is on by default and draws not-yet-seen points dark (#2A3240), and camera
    frustums are shown by default (web/src/viewer/ViewerScreen.tsx: buildUp: true, frustums: true, savedColorMode()
    -> ''height''). No change to the pipeline output format (viewer bundle, ADR 0003).


    Acceptance:

    - The default point colour is the real RGB from the bundle when it has RGB (height-blue only as the
    fallback without RGB, or by the user''s choice). The "first seen / not yet seen" timeline colouring
    is an opt-in mode, off by default.

    - Camera frustums are hidden by default, with the existing toggle to show them (text via i18n RU/KK/EN).
    When shown, frustum size still scales to the scene extent.

    - Unit tests for the defaults: RGB colour mode when the bundle has RGB, timeline colouring off, frustums
    hidden. The A4 framing-bound tests keep passing.

    - The tester takes its own screenshots of /viewer/notre-dame, /viewer/aegviidu and /viewer/room (the
    room run) in the default view: the structure is clearly visible, no frustums, no dark "not yet seen"
    points, no error banner. Sparse clouds are not expected to look like the object: judge readability,
    not recognisability.

    - No change to the pipeline output format; only web/ (and docs/) change.

    '
