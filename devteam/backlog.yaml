- id: A7a
  area: core
  title: Region of interest API
  goal: 'Backend half of A7 (split 2026-10-17: dev_app may not edit backend/). Only backend/ and docs/.
    The contract is docs/notes/roi-format.md; the web part on branch devteam/A7 already calls these routes.
    The stored JSON (version 1): {version: 1, site_id, source_run, frame (e.g. "reconstruction"), up_axis,
    min: [x, y, z], max: [x, y, z], created_at, created_by}; all fields required, other fields ignored
    and dropped on rewrite.

    - FastAPI routes GET / PUT / DELETE /api/sites/{site_id}/roi. Each declares its role with the existing
    require_role dependency (backend/app/auth.py): GET viewer (200 JSON, 404 when none is saved), PUT
    editor (validate, site_id must match the path, save, 200 with the JSON; bad body 422, body over 64
    KiB 413), DELETE editor (204, also when already absent).

    - A Pydantic v2 model for ROI version 1: required fields, finite numbers, min <= max per axis, ISO
    8601 created_at with a timezone, up_axis x|y|z.

    - Atomic write into the run catalog: <QARAU_RUNS_DIR>/sites/<site_id>/roi.json through a uniquely
    named temp file in the same directory and os.replace. Corrupt stored JSON is an error (500), never
    reported as absent.

    - Path-traversal checks: site ids match [A-Za-z0-9][A-Za-z0-9._:-]* without ''..''; encoded separators,
    traversal and symlinked site directories or files are rejected (400).

    - backend/tests/test_roi.py covers each route, roles and the shared-token auth, validation, the atomic
    write, traversal and symlinks; ruff, mypy and pytest pass.

    '
  licence: 'FastAPI (MIT) and Pydantic (MIT), already backend dependencies; no new library.

    '
  status: todo
