- id: P5a-1
  area: core
  title: Metric scale from a measured distance, and gravity
  goal: 'The user marks two points in two or more frames and gives the distance between them in metres
    (a JSON scale reference, docs/notes/scale-reference-format.md); the map is scaled to metres and rotated
    so gravity points down (camera up estimate, refined by the floor plane). The export records metric,
    scale source, gravity source and scale error; the benchmark reports scale_err_cm for a video that
    has a reference. Not in this task: the A4 sheet (P5a-2). The branch devteam/P5a-1 already has the
    first draft from P5a (scale.py, ADR 0018, tests; never checked): finish and verify it, and leave the
    a4 reference kind out of this branch (it comes back in P5a-2).

    '
  status: blocked
  blocked_reason: split from P5a (8.2 M tokens in one round, limit 8 M); `devteam resume P5a-1` to start
    it on its branch
- id: P5a-2
  area: core
  title: Metric scale from an A4 sheet
  goal: 'An A4 sheet as the scale reference: the user marks its four corners in order in two or more frames;
    the scale is fitted to the four edges and two diagonals (210 x 297 mm, both orientations), and the
    fit residual is reported as the scale error. Reuses the reference format, triangulation and alignment
    of P5a-1; a first draft of the A4 fit is in commit b26082f on branch devteam/P5a. Automatic detection
    of the sheet in images is not in this task.

    '
  status: todo
  depends_on:
  - P5a-1
- id: P4a-1b
  area: core
  title: Modal GPU provider for the dense executor
  goal: 'A Modal provider for the P4a-1 executor behind the existing GpuProvider interface (pipeline/qarau_pipeline/dense_remote.py,
    ADR 0016): start a GPU worker, upload frames, run COLMAP dense, download the results, always stop
    (finally / error / timeout). The image is built by Modal from infra/colmap-cuda (Modal image build);
    it is never pushed to a public registry. The token is read from devteam/.env as MODAL_TOKEN_ID / MODAL_TOKEN_SECRET
    at run time and is never printed, logged or written to a file (a test checks a fake token never appears
    in logs or errors). Config in pipeline/config.yaml: daily_gpu_hours_budget 1.0, est_hours_per_job
    0.5 (timeout_s within the estimate, as the loader requires); dense_remote.enabled stays false. Tests
    use a mocked Modal client only: no real Modal call, no account, no spending (developers have no Modal
    token). Record the Modal client licence (Apache-2.0) and the decision in an ADR. P4a-2 stays blocked
    until the owner says the Modal account is ready.

    '
  licence: 'modal Python client: Apache-2.0. Modal itself is a paid service: no real call in this task.

    '
  status: todo
