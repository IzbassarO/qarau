- id: P4a-1
  area: core
  title: Dense stage executor without spending money
  goal: 'A Docker image with COLMAP built for CUDA, and a provider-independent remote executor behind
    an interface: start a GPU worker, upload the frames, run dense, download the results, and always shut
    the worker down (finally / on error / on timeout, with a test for each). A timeout and a daily GPU
    budget in config.yaml (the pipeline''s or infra/, never devteam/); the executor refuses to start a
    worker that would exceed it. Tested with a fake provider only: no real GPU, no paid account.

    '
  status: todo
- id: P3c
  area: core
  title: Re-gate mykolaiv
  goal: 'After P3 mykolaiv still gives 2 models / 84.8 % registered, so it stays ungated in devteam/config.yaml
    (gates.benchmark.per_video). Goal: 1 model with >= 90 % registered frames, stable across repeated
    runs, then remove the per_video exception so mykolaiv is gated again. If that is not reachable, document
    why (frames, motion, measured run-to-run noise) in docs/notes/benchmark-method.md and keep it excluded
    with that reason.

    '
  owner: dev_pipeline
  status: done
  run: run-20261016-165310
  branch: devteam/P3c
