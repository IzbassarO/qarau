- id: S1
  area: core
  title: 'Inspection workflow: idempotent steps on a queue'
  goal: 'Today the pipeline is a CLI run by hand (pipeline/qarau_pipeline/cli.py: run, export, quality,
    segment,

    project, dense-remote, benchmark, refresh); `run` does probe -> frames (+ quality) -> sparse (COLMAP)
    ->

    export into one run dir (data/runs/<run>/{frames,colmap,web,quality_report.json,run.json,log.txt}).
    No

    queue; backend/ never learns whether a run is going (B1''s Run.status is written by nobody yet).


    Build (pipeline/, backend/, infra/, docs/):

    1. One workflow per inspection with steps probe -> frames+quality -> sparse -> export -> [dense, only
    when

    pipeline/config.yaml enables it; never a paid call from Kerege]. A step is a plain callable `step(ctx)
    ->

    StepResult` that reads its inputs from the run dir, writes its outputs under <run>/<step>/ and is

    idempotent (a finished step is a no-op unless forced). Steps know nothing about the queue: the interface

    is documented in docs/architecture.md ("Workflow steps") so Temporal can replace the runner later
    without

    touching a step.

    2. Runner: RQ on Valkey (ADR 0012; infra/docker-compose.yml gets valkey + worker services, no Redis).

    POST /api/inspections/{id}/runs (engineer) enqueues; the worker runs the steps in order and writes

    Run.status (queued | running | done | failed), current step, progress 0-100 and the step error to
    Postgres

    after every step.

    3. GET /api/inspections/{id} (viewer) returns status and the step list in the shape the web app''s

    processing view (A3) already parses: name, status, started_at, finished_at, duration_s, error.

    4. A failed step reruns alone: POST /api/inspections/{id}/runs/{run_id}/steps/{step}/rerun (engineer)
    runs

    that step and the ones after it; earlier finished steps are not redone.

    Not in this task: S3 (D1), web UI (U2 shows the progress), dense on Modal, Temporal, auto-detection.

    Done when: `docker compose up` in infra/ starts valkey + worker; a data/samples video posted through
    the

    B1 upload shows step progress changing in GET /api/inspections/{id} while /health answers in < 1 s;
    killing

    the worker mid-step and restarting redoes only the unfinished step; tests cover step idempotence,
    rerun of

    one step, status transitions and the API during a long fake step; ruff, mypy, pytest pass.

    '
