- id: A6
  area: app
  title: Viewer navigation that feels natural
  goal: "The owner works on a MacBook trackpad (no mouse): the trackpad is a first-class input. Mouse\n\
    controls stay as they are.\n- Trackpad: two-finger drag = orbit, pinch = zoom, Shift + two-finger\
    \ drag = pan. Tell pinch\n  (wheel events with ctrlKey) apart from two-finger scrolling; never zoom\
    \ on plain two-finger\n  scrolling.\n- Speed adapts to distance: orbit, pan and zoom slow down near\
    \ the target point. Hold\n  Option/Alt for precision (4x slower). A sensitivity slider in settings,\
    \ saved per user.\n- The horizon stays level (no roll). \"Align to surface\": click it, then a point;\
    \ the camera\n  turns to face that surface head-on. Preset views (top, front, side, 3/4) and \"reset\
    \ view\".\n- Orbit mode is the default. The ground is the outer terrain (not building floors), estimated\n\
    \  as the dominant lowest plane until P5a-1 gives gravity; the camera never goes below it and\n  cannot\
    \ look up from under it; it stays inside the scene box plus a margin; zoom has a min and\n  max distance.\n\
    - The camera path is a thin line with dots; a frustum only for the current or selected frame,\n  never\
    \ for all frames.\n- A mode switch with three modes (keys 1/2/3): Orbit, Walk (A8, shown disabled\
    \ until it\n  exists), Observer (A9).\n- All text via i18n (RU/KK/EN).\n- Unit tests for the event\
    \ handling (pinch vs scroll, Shift pan, Alt precision) and for the\n  constraints (ground, bounds,\
    \ zoom limits, no roll). Tester screenshots of /viewer/notre-dame, /viewer/aegviidu and /viewer/room.\n"
  status: done
  owner: dev_app
  run: cont-20261017-123453-dev_app-2
  branch: devteam/A6
  pr: https://github.com/IzbassarO/qarau/pull/33
  done_at: '2026-10-17'
