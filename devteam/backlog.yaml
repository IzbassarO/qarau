    have no Modal token). The first real GPU run is P4a-2 only.

    - Every Modal call the adapter makes (start, upload, run, download, stop) is covered by tests with
    a mocked or fake Modal client: success, error and timeout, and the worker is stopped on each path.

    - The adapter sits behind the existing GpuProvider interface: RemoteDenseExecutor is used as it is,
    and its existing tests pass unchanged.

