- id: A9
  area: app
  title: Observer mode
  goal: 'Upgrade the existing fly mode (F) into a free spectator camera: no gravity, passes through

    everything, speed adapts to distance. Game-style controls: WASD/arrows to move, Space/Shift

    up/down, mouse look with pointer lock (Esc to exit); on a trackpad, two-finger drag to look

    while the keyboard moves. A minimap in the corner (top view) shows the user as a circle with a

    view cone. Optional third-person view with the circle visible. Once P5a-1 gives metric scale, an

    optional 1.75 m human figure for scale (hidden until then). Plain, engineering-like visual

    style; Orbit stays the default mode. Multi-user shared viewing is out of scope. Unit tests for

    movement and controls; tester screenshots of /viewer/aegviidu in Observer mode.

    '
  status: done
