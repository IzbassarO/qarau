  goal: 'Today the API sets no security headers, an unhandled error can reach the client as FastAPI''s

    default, logs are not redacted, and "every route declares a role" is a convention only.


    Build (backend/, pipeline/, docs/):

    1. Middleware: Content-Security-Policy, Strict-Transport-Security, X-Content-Type-Options

    nosniff, Referrer-Policy, frame-ancestors ''none'' on every API response; docs/notes/security.md

    lists the same set for the web host (D2''s Caddy).

    2. Error responses never carry a stack trace, SQL or a file path: one handler answers 500

    {"detail": "internal error", "request_id"} and logs the details with that id.

    3. A logging filter redacts bearer tokens, the session cookie, CSRF and reset tokens, event

    codes and passwords in every log line.

    4. A route inventory test walks app.routes and the OpenAPI schema: every route declares a role

    through `require_role` or is on one explicit public list (health, sign-in, reset, guest code).

    5. pip-audit (Apache-2.0) for backend/ and pipeline/, run with `uv run pip-audit`; each finding

