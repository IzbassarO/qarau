[project]
name = "devteam"
version = "0.1.0"
description = "Qarau multi-agent dev team (dev tooling, not product)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.70",
    "httpx",  # transport errors mid-stream are not wrapped by the SDK
    "pyyaml>=6",
    "rich>=13",
    "python-dotenv>=1",
    "pillow>=11",  # MIT-CMU: downscales the tester's images to the API's size limit
]

[project.scripts]
devteam = "devteam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["backlog: checks of the real backlog, run before every status commit (gates.backlog_check)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
