[project]
name = "devteam"
version = "0.1.0"
description = "Qarau multi-agent dev team (dev tooling, not product)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.70",
    "pyyaml>=6",
    "rich>=13",
    "python-dotenv>=1",
]

[project.scripts]
devteam = "devteam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
