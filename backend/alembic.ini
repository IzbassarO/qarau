# Alembic: `cd backend && uv run alembic upgrade head`.
# The URL comes from QARAU_DATABASE_URL (or DATABASE_URL) via app.settings; the empty value here
# lets tests inject a URL with Config.set_main_option("sqlalchemy.url", ...).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =
