[project]
name = "qarau-pipeline"
version = "0.1.0"
description = "Qarau Vision processing pipeline: video -> frames -> COLMAP -> viewer bundle"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pycolmap==4.2.1",
  "numpy>=2",
  "opencv-python-headless>=4.10",
  "laspy[lazrs]>=2.5",
  "pyyaml>=6.0.3",
  "scipy>=1.14",
  "boto3>=1.35",  # Apache-2.0; S3-compatible object storage (storage.py, ADR 0024)
  "reportlab>=4.2",  # BSD-3-Clause; the PDF inspection report (report/, ADR 0027)
  "sqlalchemy>=2.0",  # MIT; the report reads the API's tables (report/inputs.py)
  "psycopg[binary]>=3.2",  # LGPL-3.0, unmodified, as in backend/; Postgres driver for the CLI
]

# A real package, so backend/ can depend on it (uv path source, editable; ADR 0023).
# hatchling (MIT) finds the qarau_pipeline/ directory by the project name.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
modal = ["modal==1.6.2"]  # ADR 0019: real dense GPU runs only (uv sync --extra modal)

[dependency-groups]
# moto: Apache-2.0, fake S3; pypdf: BSD-3-Clause, reads the report PDFs in tests
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "moto[s3]>=5", "pypdf>=5"]
ml = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: end-to-end tests on real videos (deselected by default)",
  "ml: needs the ml dependency group (uv sync --group ml); skipped when missing",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
