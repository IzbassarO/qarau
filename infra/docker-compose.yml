name: qarau

services:
  postgres:
    build: ./postgres
    image: qarau/postgres:16-postgis-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage: Versity S3 Gateway, POSIX backend (ADR 0006).
  # The image is Alpine/busybox, so the healthcheck uses wget against the gateway's --health path.
  s3:
    image: versity/versitygw:v1.9.0
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_HEALTH: /health
    ports:
      - "${S3_PORT:-7070}:7070"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue: Valkey (BSD-3-Clause), Redis-protocol compatible, never a redis image (ADR 0012).
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Pipeline worker: `rq worker qarau` running the workflow steps (S1, ADR 0022). Reads the
  # uploaded videos and writes every step's output under the shared runs dir, which is only a
  # cache of the `s3` service when QARAU_S3_BUCKET is set (ADR 0024).
  worker:
    build:
      context: ./worker
      additional_contexts:
        pipeline: ../pipeline
        backend: ../backend
    image: qarau/worker:dev
    platform: linux/amd64
    environment:
      VALKEY_URL: redis://valkey:6379/0
      QARAU_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QARAU_RUNS_DIR: /data/runs
      QARAU_PIPELINE_DIR: /app/pipeline
      QARAU_S3_ENDPOINT: http://s3:7070
      QARAU_S3_BUCKET: ${QARAU_S3_BUCKET:-}
      QARAU_S3_ACCESS_KEY: ${QARAU_S3_ACCESS_KEY:-${S3_ACCESS_KEY}}
      QARAU_S3_SECRET_KEY: ${QARAU_S3_SECRET_KEY:-${S3_SECRET_KEY}}
      QARAU_S3_REGION: ${QARAU_S3_REGION:-us-east-1}
    volumes:
      - ../data/runs:/data/runs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
  valkeydata:
